<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC-SHIELD — Hamming(12,8) Memory Protection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1e2b;
    --bg-grid: rgba(180,210,225,0.05);
    --panel: #0f2739;
    --panel-2: #133046;
    --line: rgba(180,210,225,0.16);
    --line-strong: rgba(180,210,225,0.32);
    --text: #e7eef2;
    --text-dim: #93aebd;
    --text-faint: #5d7a8a;
    --copper: #e8a33d;
    --copper-dim: #6b5327;
    --teal: #59c7b6;
    --teal-dim: #1f4a44;
    --red: #e2604f;
    --red-dim: #5a2a24;
    --radius: 3px;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0/38px 38px,
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    line-height:1.45;
  }
  a{color:inherit;}
  button{font-family:var(--sans);}

  /* ---------- header / nav ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(15,39,57,0.9), rgba(15,39,57,0.55));
    backdrop-filter:blur(2px);
    position:sticky; top:0; z-index:20;
  }
  .header-inner{
    max-width:1180px;margin:0 auto;padding:18px 24px 0 24px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{flex-shrink:0;}
  .brand-text h1{font-size:19px;font-weight:700;letter-spacing:0.02em;margin:0;}
  .brand-text p{font-size:12px;color:var(--text-dim);margin:2px 0 0 0;font-family:var(--mono);}
  .status-pill{
    font-family:var(--mono);font-size:11px;color:var(--teal);
    border:1px solid var(--teal-dim);background:rgba(89,199,182,0.08);
    padding:5px 10px;border-radius:var(--radius);white-space:nowrap;
  }
  .status-pill::before{content:"●";margin-right:6px;}

  nav{max-width:1180px;margin:14px auto 0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;}
  .tab{
    font-family:var(--mono);font-size:13px;color:var(--text-dim);
    background:transparent;border:1px solid transparent;border-bottom:none;
    padding:10px 18px;cursor:pointer;white-space:nowrap;
    border-radius:var(--radius) var(--radius) 0 0;
    position:relative;top:1px;
  }
  .tab .n{color:var(--text-faint);margin-right:8px;}
  .tab:hover{color:var(--text);}
  .tab.active{
    color:var(--copper);border-color:var(--line);
    background:var(--panel);
    border-bottom:1px solid var(--panel);
  }
  .tab.active .n{color:var(--copper);}

  main{max-width:1180px;margin:0 auto;padding:24px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin:0 0 6px 0;}
  h2.section-title{font-size:22px;margin:0 0 4px 0;font-weight:600;}
  .section-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 22px 0;max-width:60ch;}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;position:relative;
  }
  .panel + .panel{margin-top:16px;}
  .panel-corner{position:absolute;width:9px;height:9px;border-color:var(--line-strong);}
  .panel-corner.tl{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid;}
  .panel-corner.br{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid;}
  .panel-title{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);letter-spacing:0.03em;margin:0 0 14px 0;display:flex;justify-content:space-between;align-items:center;}

  .grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  /* ---------- dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:820px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--panel);}
  .stat .v{font-family:var(--mono);font-size:26px;font-weight:600;}
  .stat .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .stat.secure .v{color:var(--teal);}
  .stat.fault .v{color:var(--copper);}

  .record-list{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .record-row{
    display:grid;grid-template-columns:28px 1.4fr 100px 170px 110px 90px;gap:12px;align-items:center;
    padding:11px 14px;background:var(--panel-2);cursor:pointer;
  }
  .record-row.head{background:transparent;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);cursor:default;padding-top:0;padding-bottom:8px;border:none;}
  .record-row:not(.head):hover{background:#173a52;}
  @media (max-width:820px){.record-row{grid-template-columns:22px 1fr 70px;}
    .record-row :nth-child(4),.record-row :nth-child(5),.record-row :nth-child(6){display:none;}}
  .rid{font-family:var(--mono);color:var(--text-faint);font-size:12px;}
  .rname{font-weight:500;}
  .rstock{font-family:var(--mono);font-size:13px;color:var(--text-dim);}
  .rbits{font-family:var(--mono);font-size:12px;letter-spacing:0.12em;color:var(--text-dim);}
  .badge{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:2px;display:inline-block;white-space:nowrap;}
  .badge.secure{color:var(--teal);background:rgba(89,199,182,0.1);border:1px solid var(--teal-dim);}
  .badge.corrected{color:var(--copper);background:rgba(232,163,61,0.1);border:1px solid var(--copper-dim);}
  .arrow{color:var(--text-faint);font-family:var(--mono);}

  /* ---------- bit grid (shared: encoder / simulator / decoder) ---------- */
  .bitframe{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px 0;}
  .bitcell{
    width:46px;height:56px;border:1px solid var(--line);border-radius:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);background:var(--panel-2);position:relative;user-select:none;
  }
  .bitcell .pos{position:absolute;top:3px;font-size:9px;color:var(--text-faint);}
  .bitcell .val{font-size:19px;font-weight:600;margin-top:4px;}
  .bitcell.parity{border-color:var(--line-strong);background:#0e2233;}
  .bitcell.parity .pos{color:var(--copper);}
  .bitcell.selected{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper);}
  .bitcell.flipped .val{color:var(--red);}
  .bitcell.flipped{border-color:var(--red);}
  .bitcell.corrected{border-color:var(--teal);}
  .bitcell.corrected .val{color:var(--teal);}
  .bitcell.clickable{cursor:pointer;}
  .bitcell.clickable:hover{border-color:var(--text-dim);}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-top:10px;font-family:var(--mono);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* ---------- controls ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  select, input[type=number], input[type=text]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:var(--radius);width:100%;
  }
  select:focus, input:focus, button:focus-visible{outline:2px solid var(--copper);outline-offset:1px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{
    font-family:var(--mono);font-size:12.5px;padding:9px 16px;border-radius:var(--radius);
    border:1px solid var(--line-strong);background:var(--panel-2);color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:rgba(232,163,61,0.12);border-color:var(--copper-dim);color:var(--copper);}
  .btn.primary:hover{border-color:var(--copper);}
  .btn.good{background:rgba(89,199,182,0.12);border-color:var(--teal-dim);color:var(--teal);}
  .btn.good:hover{border-color:var(--teal);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);color:var(--text-dim);}
  tr:last-child td{border-bottom:none;}
  td.pass{color:var(--teal);}
  td.fail{color:var(--red);}

  .readout{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px;}
  .readout .item .v{font-family:var(--mono);font-size:22px;font-weight:600;}
  .readout .item .l{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}

  .empty{color:var(--text-faint);font-size:13px;font-style:normal;padding:20px 0;text-align:center;font-family:var(--mono);}
  footer{max-width:1180px;margin:10px auto 40px auto;padding:18px 24px 0 24px;border-top:1px solid var(--line);color:var(--text-faint);font-family:var(--mono);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="8" y="8" width="14" height="14" rx="1" stroke="#e8a33d" stroke-width="1.4"/>
        <rect x="12" y="12" width="6" height="6" rx="0.5" stroke="#59c7b6" stroke-width="1.4"/>
        <line x1="15" y1="1" x2="15" y2="8" stroke="#93aebd" stroke-width="1.2"/>
        <line x1="15" y1="22" x2="15" y2="29" stroke="#93aebd" stroke-width="1.2"/>
        <line x1="1" y1="15" x2="8" y2="15" stroke="#93aebd" stroke-width="1.2"/>
        <line x1="22" y1="15" x2="29" y2="15" stroke="#93aebd" stroke-width="1.2"/>
      </svg>
      <div class="brand-text">
        <h1>ECC-SHIELD</h1>
        <p>HAMMING(12,8) &middot; INVENTORY MEMORY PROTECTION</p>
      </div>
    </div>
    <div class="status-pill" id="global-status">SYSTEM ONLINE</div>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<footer>
  <span>ECC-SHIELD PROTOTYPE &middot; EC2201 DIGITAL LOGIC</span>
  <span>Single-bit correction only &middot; multi-bit faults are outside this implementation's guarantee</span>
</footer>

<script>
/* =========================================================
   Hamming(12,8) core
   Positions 1..12. Parity at 1,2,4,8. Data at 3,5,6,7,9,10,11,12.
   ========================================================= */
const PARITY_POS = [1,2,4,8];
const DATA_POS   = [3,5,6,7,9,10,11,12];

function encodeByte(byte){
  const bits = [];
  for(let i=7;i>=0;i--) bits.push((byte>>i)&1);
  const cw = new Array(13).fill(0); // 1-indexed, cw[0] unused
  DATA_POS.forEach((pos,i)=> cw[pos]=bits[i]);
  PARITY_POS.forEach(p=>{
    let x=0;
    for(let i=1;i<=12;i++){ if(i!==p && (i & p)) x ^= cw[i]; }
    cw[p]=x;
  });
  return cw.slice(1); // array[12], index0 = position1
}

function parityChecks(codeword12){
  const cw=[0,...codeword12];
  return PARITY_POS.map(p=>{
    let x=0;
    for(let i=1;i<=12;i++){ if(i & p) x ^= cw[i]; }
    return {p, pass: x===0};
  });
}

function decodeCodeword(codeword12){
  const checks = parityChecks(codeword12);
  let syndrome = 0;
  checks.forEach(c=>{ if(!c.pass) syndrome += c.p; });
  const corrected = [...codeword12];
  const errorPos = (syndrome>=1 && syndrome<=12) ? syndrome : null;
  if(errorPos) corrected[errorPos-1] ^= 1;
  const dataBits = DATA_POS.map(pos=>corrected[pos-1]);
  const dataByte = dataBits.reduce((acc,b)=>(acc<<1)|b,0);
  return {checks, syndrome, errorPos, corrected, dataBits, dataByte};
}

function bitsToStr(bits){ return bits.join(''); }

/* =========================================================
   App state
   ========================================================= */
const state = {
  tab: 'dashboard',
  records: [
    {id:1, name:'Chudithar Set',      stock:25},
    {id:2, name:'Anarkali Gown',      stock:142},
    {id:3, name:'Cotton Saree',       stock:8},
    {id:4, name:'Nightwear Combo',    stock:63},
    {id:5, name:'Silk Dupatta',       stock:200},
    {id:6, name:'Kids Kurta Set',     stock:37},
  ],
  log: [],
  simSelectedId: null,
  simErrorPos: null,     // position 1-12 chosen to inject
  simInjected: false,    // has a fault been injected on live memory
  simCorrected: false,
  decoderBits: null,     // 12-length array, manual
  decoderSourceLabel: 'Manual entry',
};

// attach a fresh codeword + status to every record
state.records.forEach(r=>{
  r.original = encodeByte(r.stock);
  r.live = [...r.original];
  r.status = 'secure'; // secure | corrected
});

function getRecord(id){ return state.records.find(r=>r.id===id); }

/* =========================================================
   Tabs
   ========================================================= */
const TABS = [
  {id:'dashboard', n:'01', label:'Dashboard'},
  {id:'encoder',   n:'02', label:'Encoder'},
  {id:'simulator', n:'03', label:'Simulator'},
  {id:'decoder',   n:'04', label:'Decoder'},
  {id:'results',   n:'05', label:'Results'},
];

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>
    `<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">
       <span class="n">${t.n}</span>${t.label}
     </button>`
  ).join('');
  nav.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; renderAll(); });
  });
}

function goTo(tabId){ state.tab = tabId; renderAll(); }

/* =========================================================
   Panel helper
   ========================================================= */
function panelCorners(){
  return `<span class="panel-corner tl"></span><span class="panel-corner br"></span>`;
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(){
  const secureCount = state.records.filter(r=>r.status==='secure').length;
  const correctedCount = state.records.filter(r=>r.status==='corrected').length;
  const totalRuns = state.log.length;
  const lastRun = state.log[state.log.length-1];

  return `
  <p class="eyebrow">OVERVIEW</p>
  <h2 class="section-title">Protected Inventory</h2>
  <p class="section-sub">Every stock record is stored as an 8-bit value inside a 12-bit Hamming codeword. Open a record in the Simulator to inject and correct a fault.</p>

  <div class="stat-row">
    <div class="stat secure"><div class="v">${secureCount}</div><div class="l">RECORDS SECURE</div></div>
    <div class="stat fault"><div class="v">${correctedCount}</div><div class="l">RECORDS CORRECTED</div></div>
    <div class="stat"><div class="v">${totalRuns}</div><div class="l">SIMULATION RUNS</div></div>
    <div class="stat"><div class="v">${lastRun ? 'P'+lastRun.errorPos : '—'}</div><div class="l">LAST FAULT POSITION</div></div>
  </div>

  <div class="panel">
    ${panelCorners()}
    <p class="panel-title"><span>INVENTORY LEDGER</span><span>${state.records.length} RECORDS</span></p>
    <div class="record-list">
      <div class="record-row head">
        <span>ID</span><span>ITEM</span><span>STOCK</span><span>CODEWORD (LIVE)</span><span>STATUS</span><span></span>
      </div>
      ${state.records.map(r=>`
        <div class="record-row" data-open="${r.id}">
          <span class="rid">${String(r.id).padStart(2,'0')}</span>
          <span class="rname">${r.name}</span>
          <span class="rstock">${r.stock}</span>
          <span class="rbits">${bitsToStr(r.live)}</span>
          <span><span class="badge ${r.status}">${r.status==='secure'?'SECURE':'CORRECTED'}</span></span>
          <span class="arrow">open →</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function wireDashboard(){
  document.querySelectorAll('[data-open]').forEach(row=>{
    row.addEventListener('click', ()=>{
      state.simSelectedId = Number(row.dataset.open);
      state.simErrorPos = null;
      state.simInjected = false;
      state.simCorrected = false;
      goTo('simulator');
    });
  });
}

/* =========================================================
   ENCODER
   ========================================================= */
let encoderByte = 25;

function renderEncoder(){
  const bits = encodeByte(encoderByte);
  const dataBinStr = bits.length ? '' : '';
  const dataBitsOnly = DATA_POS.map(p=>bits[p-1]);

  return `
  <p class="eyebrow">STAGE 02 &middot; ENCODE</p>
  <h2 class="section-title">ECC Encoder</h2>
  <p class="section-sub">Enter a stock value (0&ndash;255). It is split into 8 data bits, placed into positions 3,5,6,7,9,10,11,12, and four parity bits are computed to fill positions 1,2,4,8.</p>

  <div class="grid-2">
    <div class="panel">
      ${panelCorners()}
      <p class="panel-title"><span>INPUT</span></p>
      <div class="field">
        <label>SOURCE RECORD (OPTIONAL)</label>
        <select id="enc-record">
          <option value="">— custom value —</option>
          ${state.records.map(r=>`<option value="${r.id}" ${state.encRecordId===r.id?'selected':''}>${r.name} (${r.stock})</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>STOCK VALUE (0&ndash;255)</label>
        <input type="number" id="enc-byte" min="0" max="255" value="${encoderByte}">
      </div>
      <p class="panel-title" style="margin-top:18px;">DATA BITS (MSB → LSB)</p>
      <div class="bitframe">
        ${dataBitsOnly.map((b,i)=>`
          <div class="bitcell"><span class="pos">D${i+1}</span><span class="val">${b}</span></div>
        `).join('')}
      </div>
      <div class="btnrow">
        <button class="btn primary" id="enc-load-sim">Load into Simulator →</button>
      </div>
    </div>

    <div class="panel">
      ${panelCorners()}
      <p class="panel-title"><span>12-BIT CODEWORD</span></p>
      <div class="bitframe">
        ${bits.map((b,i)=>{
          const pos=i+1; const isParity = PARITY_POS.includes(pos);
          return `<div class="bitcell ${isParity?'parity':''}"><span class="pos">${pos}</span><span class="val">${b}</span></div>`;
        }).join('')}
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:#0e2233;border:1px solid var(--line-strong)"></span>parity bit</span>
        <span><span class="swatch" style="background:var(--panel-2);border:1px solid var(--line)"></span>data bit</span>
      </div>

      <p class="panel-title" style="margin-top:20px;">PARITY FORMULAS</p>
      <table>
        <thead><tr><th>BIT</th><th>COVERS POSITIONS</th><th>VALUE</th></tr></thead>
        <tbody>
          ${PARITY_POS.map(p=>{
            const covers=[]; for(let i=1;i<=12;i++){ if(i!==p && (i&p)) covers.push(i); }
            return `<tr><td>P${p}</td><td>XOR(${covers.join(', ')})</td><td>${bits[p-1]}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      <p class="section-sub" style="margin:14px 0 0 0;">Codeword string: <span style="color:var(--text);font-family:var(--mono)">${bitsToStr(bits)}</span></p>
    </div>
  </div>`;
}

function wireEncoder(){
  const byteInput = document.getElementById('enc-byte');
  const recordSelect = document.getElementById('enc-record');
  byteInp
